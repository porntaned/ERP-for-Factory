name: Foundation

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgresql-tdd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: erp_factory
          POSTGRES_USER: erp_factory
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_factory -d erp_factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: synthetic-ci-only-not-for-production
      DJANGO_DEBUG: "false"
      POSTGRES_DB: erp_factory
      POSTGRES_USER: erp_factory
      POSTGRES_PASSWORD: synthetic-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      # Every pytest step writes JUnit here; the last one (the full suite) feeds the summary.
      PYTEST_ADDOPTS: "--junitxml=reports/junit.xml"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.8

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Record runtime versions
        run: |
          uv run python --version
          uv run python -c "import django, psycopg; print('Django', django.get_version()); print('psycopg', psycopg.__version__)"

      - name: Verify Django configuration
        run: uv run python manage.py check

      - name: Verify PostgreSQL connection
        run: >-
          uv run python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings');
          import django; django.setup();
          from django.db import connection;
          connection.ensure_connection();
          print('vendor=' + connection.vendor);
          assert connection.vendor == 'postgresql';
          cursor = connection.cursor();
          cursor.execute('SHOW server_version');
          print('server_version=' + cursor.fetchone()[0])"

      - name: Verify model and migration state
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations to fresh PostgreSQL
        run: uv run python manage.py migrate --noinput

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run persisted-deactivation regressions
        run: uv run pytest -q tests/access_control/test_persisted_deactivation.py --tb=short

      - name: Run unsaved-user policy regressions
        run: uv run pytest -q tests/access_control/test_unsaved_user_policy.py --tb=short

      - name: Run authoritative event-identity regressions
        run: uv run pytest -q tests/quality/test_event_identity.py tests/quality/test_event_identity_migration.py --tb=short

      - name: Run stock ledger integrity tests
        run: uv run pytest -q tests/inventory/test_stock_ledger.py tests/inventory/test_stock_ledger_concurrency.py tests/inventory/test_stock_parent_lifetime.py --tb=short

      - name: Run synthetic receipt tests
        run: uv run pytest -q tests/inventory/test_stock_receipt*.py --tb=short

      - name: Run transfer Quality eligibility tests
        run: uv run pytest -q tests/inventory/test_transfer_quality.py --tb=short

      - name: Run atomic transfer tests
        run: uv run pytest -q tests/inventory/test_atomic_transfer.py --tb=short

      - name: Run transfer history tests
        run: uv run pytest -q tests/inventory/test_transfer_history.py --tb=short

      - name: Run transfer request tests
        run: uv run pytest -q tests/inventory/test_transfer_requests.py --tb=short

      - name: Run complete transfer workflow tests
        run: uv run pytest -q tests/inventory/test_transfer_workflow.py --tb=short

      - name: Run receipt and transfer serialization tests
        run: uv run pytest -q tests/inventory/test_receipt_transfer_serialization.py --tb=short

      - name: Run request key registry and migration tests
        run: uv run pytest -q tests/inventory/test_request_key_registry.py tests/inventory/test_request_key_migration.py --tb=short

      - name: Run cross-command concurrency tests
        run: uv run pytest -q tests/inventory/test_command_concurrency.py --tb=short

      - name: Run ERP tests
        run: uv run pytest -q --tb=short

      - name: Write CI evidence summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run python scripts/ci_summary.py reports/junit.xml > ci-summary.md

      - name: Upload CI evidence summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-summary
          path: ci-summary.md
          retention-days: 7

  # Separate job so only this job's token can write comments. Skipped for fork PRs,
  # whose token is read-only.
  report:
    needs: postgresql-tdd
    if: >-
      always() && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download CI evidence summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-summary

      - name: Post CI evidence summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh api "repos/$REPO/commits/$SHA/comments" -F body=@ci-summary.md > /dev/null
          if [ -n "$PR" ]; then
            id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq \
              '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- erp-ci-summary -->"))) | .id' | tail -1)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@ci-summary.md > /dev/null
            else
              gh api "repos/$REPO/issues/$PR/comments" -F body=@ci-summary.md > /dev/null
            fi
          fi
