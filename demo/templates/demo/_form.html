<form method="post" class="col-md-6">{% csrf_token %}
  {% if form.non_field_errors %}<div class="alert alert-danger">{% for e in form.non_field_errors %}{{ e }} {% endfor %}</div>{% endif %}
  {% for field in form.visible_fields %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  </div>
  {% endfor %}
  {% for field in form.hidden_fields %}{{ field }}{% endfor %}
  <button class="btn btn-primary" type="submit">{{ submit }}</button>
</form>
