{% if status == "OPEN" %}<span class="badge text-bg-primary">OPEN</span>{% elif status == "CLOSED" %}<span class="badge text-bg-success">CLOSED</span>{% elif status == "RELEASED" %}<span class="badge text-bg-success">RELEASED</span>{% elif status == "HOLD" %}<span class="badge text-bg-warning">HOLD</span>{% elif status == "REJECTED" %}<span class="badge text-bg-danger">REJECTED</span>{% else %}<span class="badge text-bg-secondary">{{ status }}</span>{% endif %}
