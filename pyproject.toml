[project]
name = "erp-for-factory"
version = "0.1.0"
description = "Portfolio ERP for a fictional LED assembly factory"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.18",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
required-version = "==0.17.1"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
